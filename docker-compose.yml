      context: ./eventList
    ports:
      - "3005:3005"
    command: npm run start:standalone

  login:
    build:
      context: ./login
    ports:
      - "3006:3006"
    command: npm run start:standalone

  monitor:
    build:
      context: ./monitor
    ports:
      - "3003:3003"
    command: npm run start:standalone

  register:
    build:
      context: ./register
    ports:
      - "3007:3007"
    command: npm run start:standalone

  sidebar:
    build:
      context: ./sidebar
