version: '3.8'

services:
  webshell:
    build:
      context: ./webshell
    ports:
      - "9000:9000"
    command: npm start

  admin:
    build:
      context: ./admin
    ports:
      - "3008:3008"
    command: npm run start:standalone

  appbar:
    build:
      context: ./appbar
    ports:
      - "3001:3001"
    command: npm run start:standalone

  assetinventory:
    build:
