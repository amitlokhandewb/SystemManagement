server {
    listen 3008;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;  # Handle all routes via React
    }

    # Optionally serve other static assets
    location /static/ {
        root /usr/share/nginx/html;
    }
}
